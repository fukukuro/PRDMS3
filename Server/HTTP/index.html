<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="Logo_Parent"><img src="./Logo_light.png" id="Logo"></div>
        <div id="left_panel">
            <button class="lp_child">走行位置</button><br>
        </div>
        <div id="header_panel">/*画面タイトル*/</div>
        <div id="main_panel">
            <h3 id="State">走行位置</h3>
            <div id="State_disp"></div>
        </div>
        <script>
            //走行位置表示プログラム
            function createHtmlTable(sections, formations) {
                let tableHTML = "<table class='Statetable'>\n";

                // ヘッダー行の作成
                tableHTML += "  <tr>\n";
                sections.forEach(section => {
                    tableHTML += `    <th class='.Statedisp_tr1'>${section}</th>\n`;
                });
                tableHTML += "  </tr>\n";

                // フォーメーションの処理
                const formationMap = new Map(formations.map(f => [f[0], f[1]]));
                const sectionFormationMap = new Map();

                for (const [formation, sectionList] of formationMap) {
                    sectionList.forEach(section => {
                    if (sectionFormationMap.has(section)) {
                        sectionFormationMap.get(section).push(formation);
                    } else {
                        sectionFormationMap.set(section, [formation]);
                    }
                    });
                }

                tableHTML += "  <tr>\n";
                let i = 0;
                while (i < sections.length) {
                    const currentSection = sections[i];
                    const formationsInSection = sectionFormationMap.get(currentSection) || [];

                    if (formationsInSection.length > 0) {
                    let j = i;
                    const linkedFormations = new Set(formationsInSection);
                    let colspan = 1;

                    // 隣接するセクションで同じフォーメーションを持つものを結合
                    while (j + 1 < sections.length) {
                        const nextSection = sections[j + 1];
                        const nextSectionFormations = sectionFormationMap.get(nextSection) || [];
                        const allFormationsPresent = formationsInSection.every(f => nextSectionFormations.includes(f));

                        if (allFormationsPresent && nextSectionFormations.length > 0) {
                        formationsInSection.forEach(f => linkedFormations.add(f));
                        colspan++;
                        j++;
                        } else {
                        break;
                        }
                    }

                    const formationLabel = Array.from(linkedFormations).sort().join(",");
                    tableHTML += `    <td colspan="${colspan}" class="Statedisp_td1">${formationLabel}</td>\n`;
                    i = j + 1;
                    } else {
                    tableHTML += `    <td>在線なし</td>\n`;
                    i++;
                    }
                }
                tableHTML += "  </tr>\n";

                tableHTML += "</table>";
                return tableHTML;
                }

                const sections = ["S1", "S2", "S3", "S4", "S5"];
                const formations = [
                ["F1", ["S1", "S2"]],
                ["F2", ["S3", "S4"]]
                ];

                const htmlTable = createHtmlTable(sections, formations);
                document.getElementById("State_disp").innerHTML = htmlTable;
        </script>
        <style>
            body{
                display: grid;
                grid-template-columns: 20vw 1fr;
                grid-template-rows: 7vh 1fr;
                color: white;
                background-color: #000025;
                margin: 0;
                font-family: "Zen Kaku Gothic New";
                font-size: 25px;
            }
            #Logo_Parent{
                grid-row: 1;
                grid-column: 1;
                background-color: rgba(0,0,0,0.25);
            }
            #Logo{
                height: 90%;
                width: auto;
                filter: invert();
            }
            #left_panel {
                grid-row: 2;
                grid-column: 1;
                background-color: rgba(0,0,0,0.125);
                height: 93vh;
                width: 20vw;
            }
            #header_panel {
                grid-row: 1;
                grid-column: 2;
                background-color: rgba(0,0,0,0.25);
                font-size: 40px;
            }
            #main_panel {
                grid-row: 2;
                grid-column: 2;
            }
            .lp_child {
                width: 100%;
                height: 10%;
                appearance: none;
                background-color: transparent;
                border: none;
                color: white;
                text-align: right;
                font-size: 20px;
            }
            #State_disp {
                overflow-x: auto; 
            }
            .StateTable {
                font-size: 20px;
            }
            .Statedisp_td1 {
                text-align: center;
                border-left: 1px solid white;
                border-right: 1px solid white;
            }
            .Statedisp_tr1 {
                border-left: 1px solid white;
                border-right: 1px solid white;
            }
        </style>
    </body>
</html>
